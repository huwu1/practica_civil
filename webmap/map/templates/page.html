<html>
    <head>
        <title>Mapa de Congestión</title>
        <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no">
        <script src='https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.js'></script> <!-- mapbox-->
        <link href='https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.css' rel='stylesheet' /> <!-- mapbox-->
        <style>
            body { margin: 0; padding: 0; }
            #map { position: absolute; top: 0; bottom:0; width: 100%;}

            .map-overlay {
                font: 12px/20px 'Helvetica Neue', Arial, Helvetica, sans-serif;
                position: absolute;
                width: 25%;
                top: 0;
                left: 0;
                padding: 10px;
                z-index: 100;
            }
            .map-overlay .map-overlay-inner {
                background-color: #fff;
                box-shadow: 0 1px 2px rgba(0, 0, 0, 0.20);
                border-radius: 10px;
                padding: 10px;
                text-align: center;
                margin-bottom: 10px;
                font-size: 14px; 
                font-weight: bold;
                
            }
            

            /* Estilos para el contenedor del slider para darle espacio */
            #slider {
                /* Aumenta el ancho total del slider para que llene el contenedor */
                width: 100%;
                /* Un poco de margen arriba y abajo */
                margin: 5px 0;
                /* Elimina los estilos por defecto del navegador para poder personalizarlo */
                -webkit-appearance: none;
                appearance: none;
                /* Fondo transparente */
                background: rgb(200, 188, 188);
            }

            /* Para Chrome, Safari, Edge */
            #slider::-webkit-slider-runnable-track {
                width: 100%;
                height: 20px; /* <-- ¡AQUÍ CONTROLAS EL ANCHO DE LA LÍNEA! Auméntalo a tu gusto */
                cursor: pointer;
                background:rgba(0, 0, 0, 0.05); /* Color de la barra */
                border-radius: 6px; /* Bordes redondeados */
            }    
            
            /* El Cuadrado Negro (Thumb) */
            #slider::-webkit-slider-thumb {
                -webkit-appearance: none;
                height: 30px;    /* <--- ¡IMPORTANTE! Debe ser IGUAL a la altura del track (30px) */
                width: 45px;     /* Ancho del manejador (hazlo más ancho si quieres que sea fácil de agarrar) */
                background: #111; /* Negro */
                cursor: grab;
                margin-top: -5px; /* Al tener la misma altura, el margen es 0 */
                border-radius: 5px; /* Bordes redondeados del cuadrado */
            }

        </style>
    </head> 
    <body>
        
        <div id="map"></div>

        <div class="map-overlay top">
            <div class="map-overlay-inner">
                <div class="selector-dia-container">
                    <label for="dia-select">Día:</label>
                    <select id="dia-select">
                        <option value="Lunes">Lunes</option>
                        <option value="Martes">Martes</option>
                        <option value="Miércoles">Miércoles</option>
                        <option value="Jueves">Jueves</option>
                        <option value="Viernes">Viernes</option>
                        <option value="Sábado">Sábado</option>
                        <option value="Domingo">Domingo</option>
                    </select>
                </div>

                <h2>Hora: <label id="hora-label">06:30</label></h2>
                <input id="slider" type="range" min="0" max="1425" step="15" value="0">
            </div>
        </div>

        <script>
            mapboxgl.accessToken = 'pk.eyJ1IjoiaHV3dSIsImEiOiJjbWpzdDhpc3czaTd1M2NvamlkNXVicWd6In0.cFdXVIOLckEUTYLHRC9uOQ'
            const map = new mapboxgl.Map({
                container: 'map',
                style: 'mapbox://styles/mapbox/dark-v11',
                center: [-70.60317798251957, -33.45911872061706],  
                zoom: 14.5
            });
            
            // para añadir marcadores:

            // const marker1 = new mapboxgl.Marker({
            // color:  'green'  |
            // rotation: 45     |--> características
            // ...              |
            // })
            // .setLngLat([x, y]) -> ubicacion
            // .addTo(map); -> se añade

            // controles (zoom, direccion norte, etc)
            map.addControl(new mapboxgl.FullscreenControl(), 'top-right');
            map.addControl(new mapboxgl.NavigationControl(), 'top-right');

            map.on('load', () => {

                // 1. La fuente es la misma de antes (tu API actualizada)
                map.addSource('mis-datos-red', {
                    type: 'geojson',
                    data: '/api/traffic-data/' 
                });

                // 2. CAPA DE LÍNEAS (ARISTAS)
                // Mapbox buscará automáticamente las geometrías "LineString" en tu API
                map.addLayer({
                    id: 'capa-aristas',
                    type: 'line',         // <--- Tipo 'line' para las aristas
                    source: 'mis-datos-red',
                    layout: {
                        'line-join': 'round',
                        'line-cap': 'round'
                    },
                    paint: {
                    'line-color': '#D3D3D3', // Color gris
                        'line-width': 3,       // Grosor de la línea
                        'line-offset': 5
                    }
                });

                // 3. CAPA DE PUNTOS (NODOS)
                // Mapbox buscará automáticamente las geometrías "Point"
                map.addLayer({
                    id: 'capa-nodos',
                    type: 'circle',
                    source: 'mis-datos-red', // <--- ¡Misma fuente!
                    paint: {
                        'circle-radius': 7,
                        'circle-color': '#FF0000'
                        }
                    });
            });

                // 1. Crear una instancia del Popup (pero aún no lo mostramos)
                const popup = new mapboxgl.Popup({
                    closeButton: false,
                    closeOnClick: false
                });

                // 2. Evento: Cuando el mouse ENTRA en una línea de 'capa-aristas'
                map.on('mouseenter', 'capa-aristas', (e) => {
                    // Cambiar el cursor a una manito para indicar que es interactivo
                    map.getCanvas().style.cursor = 'pointer';

                    // Obtener las coordenadas donde está el mouse
                    const coordinates = e.lngLat;
                    
                    // Obtener las propiedades del tramo (asegúrate que tu API mande 'id_arco')
                    // Si en tu GeoJSON el campo se llama 'id', cámbialo abajo.
                    const propiedades = e.features[0].properties;
                    const idTramo = propiedades.id; 
                    const calle = propiedades.calle_principal;
                    const sentido = propiedades.sentido;

                    // Configurar el HTML del popup y mostrarlo
                    popup.setLngLat(coordinates)
                        .setHTML(`<strong>ID: ${idTramo}</strong><br>Calle: ${calle}<br>Sentido: ${sentido}`)
                        .addTo(map);
                });

                // 3. Evento: Cuando el mouse SALE de la línea
                map.on('mouseleave', 'capa-aristas', () => {
                    map.getCanvas().style.cursor = ''; // Restaurar cursor
                    popup.remove(); // Quitar el popup
                });
        </script>
    </body>
</html>

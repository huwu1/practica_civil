<html>
    <head>
        <title>Mapa de Congestión</title>
        <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no">
        <script src='https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.js'></script> <!-- mapbox-->
        <link href='https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.css' rel='stylesheet' /> <!-- mapbox-->
        <style>
            body { margin: 0; padding: 0; }
            #map { position: absolute; top: 0; bottom:0; width: 100%;}

            .map-overlay {
                font: 12px/20px 'Helvetica Neue', Arial, Helvetica, sans-serif;
                position: absolute;
                width: 25%; 
                top: 0;
                left: 0;
                padding: 10px;
                z-index: 100;
            }
            .map-overlay .map-overlay-inner {
                background-color: #fff;
                box-shadow: 0 1px 2px rgba(0, 0, 0, 0.20);
                border-radius: 10px;
                padding: 10px;
                text-align: center;
                margin-bottom: 10px;
                font-size: 14px; 
                font-weight: bold;
                
            }    

            /* Estilos para el contenedor del slider para darle espacio */
            #slider {
                width: 100%;
                margin: 5px 0;
                -webkit-appearance: none;
                appearance: none;
                background: rgb(200, 188, 188);
            }

            /* Para Chrome, Safari, Edge */
            #slider::-webkit-slider-runnable-track {
                width: 100%;
                height: 20px;
                cursor: pointer;
                background:rgba(0, 0, 0, 0.05);
                border-radius: 6px;
            }    
            
            /* El Cuadrado Negro (Thumb) */
            #slider::-webkit-slider-thumb {
                -webkit-appearance: none;
                height: 30px;   
                width: 45px;    
                background: #111;
                cursor: grab;
                margin-top: -5px; 
                border-radius: 5px;
            }

            /* Estilos para la leyenda de congestión */
            .map-overlay-legend {
                    font: 12px/20px 'Helvetica Neue', Arial, Helvetica, sans-serif;
                    position: absolute;
                    bottom: 30px;  
                    right: 10px;   
                    background-color: #fff;
                    padding: 10px;
                    border-radius: 10px;
                    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.20);
                    z-index: 100;
                }

            #leyenda-congestion{
                width: 180px;
            }

            #leyenda-gradiente{
                width: 300px;
            }

                .map-overlay-legend h3 {
                    margin: 0 0 10px;
                    font-size: 13px;
                    font-weight: bold;
                    color: #333;
                }

                .legend-item {
                    display: flex;
                    align-items: center;
                    margin-bottom: 5px;
                    color: #555;
                }

                .dot {
                    width: 12px;
                    height: 12px;
                    border-radius: 50%;
                    margin-right: 8px;
                }

                /* Estilos para la leyenda de gradiente */
                .gradient-bar {
                    height: 15px;
                    width: 100%;
                    border-radius: 4px;
                    margin: 8px 0;
                    box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
                }

                .gradient-labels {
                    display: flex;
                    justify-content: space-between;
                    font-size: 10px;
                    color: #333;
                    margin-top: 2px;
                }    

        </style>
    </head> 
    <body>
        
        <div id="map">

            <div class="map-overlay top">
                <div class="map-overlay-inner">
                    <div class="selector-dia-container">
                        <div class="control-group">
                            <label for="dia-select">Día de la semana:</label>
                            <select id="dia-select">
                                <option value="Monday">Lunes</option>
                                <option value="Tuesday">Martes</option>
                                <option value="Wednesday">Miércoles</option>
                                <option value="Thursday">Jueves</option>
                                <option value="Friday">Viernes</option>
                                <option value="Saturday">Sábado</option>
                                <option value="Sunday">Domingo</option>
                            </select>
                        </div>
                        
                        <div class="control-group">
                            <label for="propiedad-select>">Propiedad:</label>
                            <select id="propiedad-select">
                                <option value="nivel_congestion">Nivel de congestión</option>
                                <option value="velocidad">Velocidad</option>
                                <option value="tiempo">Tiempo</option>
                                <option value="dca">DCA</option>
                            </select>
                        </div>    
                    </div>

                    <h2>Hora: <label id="hora-label">06:30</label></h2>
                    <input id="slider" type="range" min="390" max="1310" step="15" value="0">

                </div>

            </div>

            <div class="map-overlay-legend" id="leyenda-congestion">
                <h3>Niveles de Congestión</h3>
                <div class="legend-item"><div class="dot" style="background:#31C950;"></div>Flujo libre (1)</div>
                <div class="legend-item"><div class="dot" style="background:#9AE630;"></div>Interacción sin congestión (2)</div>
                <div class="legend-item"><div class="dot" style="background:#FFDF20;"></div>Congestión tolerable (3)</div>
                <div class="legend-item"><div class="dot" style="background:#FF8904;"></div>Congestión alta (4) </div>
                <div class="legend-item"><div class="dot" style="background:#E7180B;"></div>Saturado (5)</div>
                <div class="legend-item"><div class="dot" style="background:#CC00CC;"></div>Saturación extrema (6)</div>
            
            </div>

            <div class="map-overlay-legend" id="leyenda-gradiente" style="display: none;">
                <h3 id="titulo-gradiente">Velocidad</h3>
                <div class="gradient-bar" id="barra-color"></div>
                <div class="gradient-labels">
                <span id="min-val">3.46</span>
                <span id="max-val">58.22</span>
            </div>
            
        </div>  

        <script>
            mapboxgl.accessToken = 'pk.eyJ1IjoiaHV3dSIsImEiOiJjbWpzdDhpc3czaTd1M2NvamlkNXVicWd6In0.cFdXVIOLckEUTYLHRC9uOQ'
            const map = new mapboxgl.Map({
                container: 'map',
                style: 'mapbox://styles/mapbox/dark-v11',
                center: [-70.60317798251957, -33.45911872061706],  
                zoom: 14.5
            });

            // Referencias a los controles HTML
            const slider = document.getElementById('slider');
            const display = document.getElementById('hora-label');
            const diaSelect = document.getElementById('dia-select');
            const propiedadSelect = document.getElementById('propiedad-select');
            const leyendaCongestion =  document.getElementById('leyenda-congestion');

            // Referencias al gradiente
            const leyendaGradiente = document.getElementById('leyenda-gradiente');
            const tituloGradiente = document.getElementById('titulo-gradiente');
            const barraColor =  document.getElementById('barra-color');
            const minVal = document.getElementById('min-val');
            const maxVal = document.getElementById('max-val');


            // Minutos (totales) que trae el slider x debajo (múltiplos de 15)
            let minutosTotales = parseInt(slider.value);

            // Día seleccionado
            let diaActual = diaSelect.value;

            // Propiedad seleccionada
            let propiedadActual = propiedadSelect.value;

            // Función para transformar la cantidad de minutos que lleva el slider acumulados 
            // en el formato TimeField() de los datos
            function getHora(minutosInput) {
                const h = Math.floor(minutosInput / 60);
                const m = minutosInput % 60;

                const hStr = h.toString().padStart(2, '0');
                const mStr = m.toString().padStart(2, '0');
                return `${hStr}:${mStr}:00`; // formato TimeField() (06:00:00)
            }

            // mayor valor de velocidad = 3,46
            // menor valor de velocidad = 58,22

            // menor valor de tiempo = 11,57
            // mayor valor de tiempo = 477,83

            // menor valor DCA = 0.0
            // mayor valor DCA = 851.0

            // (interpolación por quintiles (0, 20, 40, 60, 80, 100))
            function actualizarColores(columna){
                let color;

                if (columna == 'velocidad'){
                    color = [
                        'interpolate', ['linear'], ['get', columna],
                        3.46, '#CC00CC',  
                        10.0, '#E7180B',      
                        18.0, '#FF8904',      
                        25.0, '#FFDF20',      
                        35.0, '#9AE630',      
                        58.22, '#31C950'
                    ];
                }

                // en el tiempo habian 319 datos sobre 200, para evitar outlayers en la
                // representación visual, se redujo el cap a 200
                else if (columna == 'tiempo'){
                    color = [
                        'interpolate', ['linear'], ['get', columna],
                        11.57, '#31C950',     
                        39.39, '#9AE630',     
                        51.2, '#FFDF20',     
                        63.0, '#FF8904',
                        100.0, '#E7180B',
                        200.0, '#CC00CC',           
                    ];
                } 

                // el 60% de los datos de DCA eran 0's, por lo que se 
                else if (columna = 'dca'){
                    color = [
                        'interpolate', ['linear'], ['get', columna],
                        0.0, '#31C950',
                        5.0, '#9AE630',
                        30, '#FFDF20',
                        80.0, '#FF8904',
                        215.0, '#E7180B',
                        450.0, '#CC00CC'
                    ]
                }
                
                else {
                    color = [
                        'match',
                        ['get', 'nivel_congestion'],
                            1, '#31C950',
                            2, '#9AE630',
                            3, '#FFDF20',
                            4, '#FF8904',
                            5, '#E7180B',
                            6, '#CC00CC',
                            '#D3D3D3'
                    ];

                }

                if (map.getLayer('capa-aristas')) {
                    map.setPaintProperty('capa-aristas', 'line-color', color);
                }
            }

            function actualizarInterfaz(propiedad){

                if (propiedad == 'nivel_congestion'){
                    leyendaCongestion.style.display = 'block';
                    leyendaGradiente.style.display = 'none';
                }

                else{
                    leyendaCongestion.style.display = 'none';
                    leyendaGradiente.style.display = 'block';

                    if(propiedad == 'velocidad'){
                        tituloGradiente.innerText = 'Velocidad (km/h)'
                        minVal.innerText = '3.46'
                        maxVal.innerText = '58.22'
                        barraColor.style.background = 'linear-gradient(to right, #CC00CC, #E7180B, #FF8904, #FFDF20, #9AE630, #31C950)';
                    }

                    else if(propiedad == 'tiempo'){
                        tituloGradiente.innerText = 'Tiempo (s/km)'
                        minVal.innerText = '11.57'
                        maxVal.innerText = '200.0'
                        barraColor.style.background = 'linear-gradient(to right, #31C950, #9AE630, #FFDF20, #FF8904, #E7180B, #CC00CC)';
                    }

                    else if(propiedad == 'dca'){
                        tituloGradiente.innerText = 'DCA (s/km)'
                        minVal.innerText = '0.0'
                        maxVal.innerText = '450.0'
                        barraColor.style.background =  'linear-gradient(to right, #31C950, #9AE630, #FFDF20, #FF8904, #E7180B, #CC00CC)'
                    }
                }
            }

            // Función para displayear lo que corresponda según el slider y el día seleccionado
            // a través de filtros literales
            function actualizarMapa() {
                const hora = getHora(minutosTotales);

                const filtro = [
                    'all',
                    ['==', ['get', 'dia'], diaActual],
                    ['==', ['get', 'hora'], hora],
                    ['has', propiedadActual],
                ];

                if (map.getLayer('capa-aristas')) {
                    map.setFilter('capa-aristas', filtro);

                    // Según la propiedad seleccionada, cambian los colores
                    actualizarColores(propiedadActual);
                }
                
                // Para actualizar la hora mostrada x el slider
                const hVis = Math.floor(minutosTotales / 60).toString().padStart(2, '0');
                const mVis = (minutosTotales % 60).toString().padStart(2, '0');
                display.innerText = `${hVis}:${mVis}`;
            }


            // Listeners: Cuando el usuario toca algo

            // Hora
            slider.addEventListener('input', (e) => {
                minutosTotales = parseInt(e.target.value);
                actualizarMapa();
            });

            // Día
            diaSelect.addEventListener('change', (e) => {
                diaActual = e.target.value;
                actualizarMapa();
            });

            // Propiedad
            propiedadSelect.addEventListener('change', (e) => {
                propiedadActual = e.target.value;

                actualizarMapa();
                actualizarInterfaz(propiedadActual);
                
            });

            // controles (zoom, direccion norte, etc)
            map.addControl(new mapboxgl.FullscreenControl(), 'top-right');
            map.addControl(new mapboxgl.NavigationControl(), 'top-right');

            map.on('load', () => {

                // La fuente es la misma de antes
                map.addSource('datos-red', {
                    type: 'geojson',
                    data: '/api/traffic-data/' 
                });

                // CAPA DE LÍNEAS (ARISTAS)
                map.addLayer({
                    id: 'capa-aristas',
                    type: 'line',    
                    source: 'datos-red',
                    layout: {
                        'line-join': 'round',
                        'line-cap': 'round'
                    },
                    paint: {
                        'line-width': 3,     
                        'line-offset': 5,
                        'line-color': [
                            'match',
                            ['get', 'nivel_congestion'],
                                1, '#31C950',
                                2, '#9AE630',
                                3, '#FFDF20',
                                4, '#FF8904',
                                5, '#E7180B',
                                6, '#CC00CC',
                                '#D3D3D3'
                            ],
                    }
                });

                actualizarMapa();

                // CAPA DE PUNTOS (NODOS)
                map.addLayer({
                    id: 'capa-nodos',
                    type: 'circle',
                    source: 'datos-red',
                    filter: ['==', '$type', 'Point'],
                    paint: {
                        'circle-radius': 7,
                        'circle-color': '#FF0000'
                        }
                    });
            });

                // Crear una instancia del Popup
                const popup = new mapboxgl.Popup({
                    closeButton: false,
                    closeOnClick: false
                });

                // Evento: Cuando el mouse ENTRA en una línea de 'capa-aristas'
                map.on('mouseenter', 'capa-aristas', (e) => {

                    // Cambiar el cursor a una manito para indicar que es interactivo
                    map.getCanvas().style.cursor = 'pointer';

                    // Obtener las coordenadas donde está el mouse
                    const coordinates = e.lngLat;
                    
                    // Obtener las propiedades del tramo 
                    const propiedades = e.features[0].properties;
                    const idTramo = propiedades.id; 
                    const calle = propiedades.calle_principal;
                    const sentido = propiedades.sentido;
                    const tiempo = propiedades.tiempo;
                    const velocidad = propiedades.velocidad;
                    const tiempo_entre_largo = propiedades.tiempo_entre_largo;
                    const congestion = propiedades.nivel_congestion;
                    const dca = propiedades.dca;

                    // Configurar el HTML del popup y mostrarlo
                    popup.setLngLat(coordinates)
                        .setHTML(`
                            <div style= "text-align: left; line-height: 1.5;">
                                <strong>ID: ${idTramo}</strong><br>
                                    Calle: ${calle}<br>
                                    Sentido: ${sentido}<br>
                                    Tiempo: ${tiempo}<br>
                                    Velocidad: ${velocidad}<br>
                                    Tiempo/Largo: ${tiempo_entre_largo}<br>
                                    Congestion: ${congestion}<br>
                                    DCA: ${dca}<br>
                            </div>
                        `)
                        .addTo(map);
                });

                // Evento: Cuando el mouse SALE de la línea
                map.on('mouseleave', 'capa-aristas', () => {
                    map.getCanvas().style.cursor = '';
                    popup.remove();
                });
        </script>
    </body>
</html>
